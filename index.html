<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#dbe6ff"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1024">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Gym Log</title>
<style>
:root{--tx:#10151f;--mut:rgba(16,21,31,.6);--g1:rgba(255,255,255,.66);--g2:rgba(255,255,255,.26);--ln:rgba(255,255,255,.75);--in:rgba(255,255,255,.55);--sh:rgba(40,60,120,.2);--solid:rgba(250,251,255,.93);--ac:#2f5bff;--ac2:#7aa2ff;--rest:#12b886;--pr:#f59f00;--bgA:#dbe6ff;--bgB:#f2e4ff;--bgC:#ffe8dd;--b1:rgba(70,110,255,.45);--b2:rgba(255,120,200,.4);--b3:rgba(40,210,170,.38);padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--tx:#f2f5fb;--mut:rgba(242,245,251,.6);--g1:rgba(255,255,255,.17);--g2:rgba(255,255,255,.05);--ln:rgba(255,255,255,.26);--in:rgba(255,255,255,.1);--sh:rgba(0,0,0,.45);--solid:rgba(28,34,50,.95);--ac2:#6d8cff;--rest:#3ddc9f;--pr:#ffc247;--bgA:#0a1024;--bgB:#1b1033;--bgC:#0b1f2b;--b1:rgba(70,100,255,.35);--b2:rgba(190,70,255,.28);--b3:rgba(20,190,160,.26)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bgA)}
body{margin:0;color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));touch-action:manipulation}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;z-index:-1;pointer-events:none;background:linear-gradient(160deg,var(--bgA),var(--bgB) 55%,var(--bgC))}
.bg i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;background:radial-gradient(circle,var(--b) 0,transparent 62%);animation:drift 20s ease-in-out infinite alternate}
.bg i:nth-child(1){--b:var(--b1);left:-30vmax;top:-25vmax}
.bg i:nth-child(2){--b:var(--b2);right:-40vmax;top:20vh;animation-duration:26s;animation-delay:-8s}
.bg i:nth-child(3){--b:var(--b3);left:-20vmax;bottom:-40vmax;animation-duration:23s;animation-delay:-14s}
@keyframes drift{to{transform:translate3d(14vw,10vh,0) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translate3d(0,18px,0) scale(.98)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}60%{transform:scale(1.1)}}
@keyframes pulse{to{opacity:.28}}
@keyframes breathe{50%{transform:scale(1.18)}}
#app{max-width:520px;margin:0 auto;padding:12px 14px}
.in>*{animation:rise .5s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--n,0)*45ms)}
.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1) backwards}
h2{margin:6px 0 12px;font-size:26px;font-weight:800;letter-spacing:-.5px}
button,.btn,input{font:inherit;color:inherit}
button,.btn{border:1px solid var(--ln);border-radius:14px;padding:10px 14px;cursor:pointer;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 var(--in);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
button:active,.btn:active{transform:scale(.93)}
input{background:var(--in);border:1px solid var(--ln);border-radius:12px;padding:10px;width:100%;min-width:0;outline:0;transition:box-shadow .2s}
input:focus{box-shadow:0 0 0 2px var(--ac)}
input::placeholder{color:var(--mut)}
.card,#nav{background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--ln);box-shadow:inset 0 1px 0 var(--in),inset 0 -1px 0 rgba(255,255,255,.08),0 10px 28px var(--sh);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%)}
.card{border-radius:22px;padding:14px;margin:12px 0}
.pri,.rb{display:block;width:100%;border:0;color:#fff;font-weight:700;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pri{background:linear-gradient(145deg,var(--ac),var(--ac2));margin-top:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px rgba(47,91,255,.35)}
.rb{background:linear-gradient(145deg,var(--rest),#63e6be);padding:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(18,184,134,.35)}
.row{display:flex;align-items:center;justify-content:space-between}
.row>button{margin-left:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));grid-gap:8px}
.chips button{padding:10px 4px}
.chips .on{background:linear-gradient(145deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(47,91,255,.4)}
.set{position:relative;display:inline-block;background:var(--in);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;margin:4px 6px 4px 0;font-variant-numeric:tabular-nums}
.set.p{border-color:var(--pr)}
.set.p:after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;background:var(--pr);opacity:0;animation:pulse 1.8s ease-in-out infinite alternate;pointer-events:none}
.add{display:grid;grid-template-columns:1fr 1fr auto;grid-gap:8px;margin-top:10px}
.g{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px}
label{font-size:13px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:6px;text-align:center}
.cal i{font-style:normal;color:var(--mut);font-size:13px}
.c{height:44px;padding:0;border-radius:14px;animation:pop .4s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--d)*14ms)}
.c.w{background:linear-gradient(145deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.c.r{background:linear-gradient(145deg,var(--rest),#63e6be);color:#fff;border-color:transparent}
.c.t{box-shadow:0 0 0 2px var(--tx)}
.mut{color:var(--mut)}
.mw{position:relative;display:inline-block;margin:4px 8px 4px 0}
.th{width:96px;height:96px;object-fit:cover;border-radius:16px;display:block}
.mw b{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px}
.zz{font-size:44px;display:inline-block;animation:breathe 3s ease-in-out infinite}
#warn{background:var(--pr);color:#fff;padding:10px 14px;font-weight:600}
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;display:flex;padding:5px;border-radius:28px;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%)}
#nav u{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);border-radius:23px;background:var(--in);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px var(--sh);transform:translate3d(calc(var(--i,0)*100%),0,0);transition:transform .5s cubic-bezier(.34,1.45,.5,1)}
#nav button{position:relative;flex:1;border:0;background:none;box-shadow:none;font-size:12px;color:var(--mut);padding:7px 0}
#nav span{display:block;font-size:20px}
#nav .on{color:var(--ac);font-weight:700}
.lite .bg i{display:none}
.lite *{animation:none!important}
.lite .card,.lite #nav{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,#nav{background:var(--solid)}}
.lk{background:none;border:0;box-shadow:none;padding:2px 0 10px;text-decoration:underline;color:var(--ac);font-weight:600}
.pvp{max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-bottom:10px}
.pvd{font-size:13px;color:var(--mut);margin:8px 0 4px}
.pv{margin:0 6px 6px 0;padding:7px 10px;border-radius:12px;font-size:14px;text-align:left}
.pv small{display:block;color:var(--mut);font-size:11px}
.pv:disabled{opacity:.55}
.rv{animation:fadeIn .35s ease backwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes up{from{transform:translate3d(0,100%,0)}}
.gr{display:block;width:100%;height:auto;color:var(--ac)}
.gr text{fill:var(--mut);font-size:10px}.gr .v{fill:var(--tx);font-weight:700}
.gr line{stroke:var(--mut);opacity:.35;stroke-dasharray:3 4}
.gr .ar{fill:currentColor;opacity:.14}
.gr .ln{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.gr .dt{fill:currentColor}.gr .dt.m{fill:var(--pr)}
.in .gr .ln,#sheet .gr .ln{animation:draw 1s ease-out backwards}
.in .gr .ar,#sheet .gr .ar{animation:fadeIn .8s ease .2s backwards}
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
#sheet[hidden]{display:none}
#sheet .card{width:100%;max-width:520px;margin:0;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .45s cubic-bezier(.2,.9,.3,1)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;margin-top:12px;text-align:center}
.g3 div{background:var(--in);border-radius:14px;padding:8px}.g3 b{display:block;font-size:17px}
.b3d{position:relative;height:380px;border-radius:16px;background:radial-gradient(ellipse at 50% 96%,rgba(47,91,255,.3),transparent 58%)}
</style></head><body>
<div id="warn" hidden>Storage is blocked here, so nothing will be saved. Open this file in Chrome from your Downloads folder.</div>
<div class="bg"><i></i><i></i><i></i></div><div id="app"></div><nav id="nav"><u></u><button onclick="tab(0)"><span>🏋️</span>Log</button><button onclick="tab(1)"><span>📅</span>Calendar</button><button onclick="tab(2)"><span>📈</span>Graph</button><button onclick="tab(3)"><span>⚖️</span>Body</button><button onclick="tab(4)"><span>⚙️</span>Settings</button></nav><div id="sheet" hidden onclick="if(event.target===this)history.back()"></div>
<script>
let D={days:{},body:[]},db,v='day',cm=new Date(),pop='',st,more=false;
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),
ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),T=ymd(new Date()),
esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
fmt=k=>new Date(k+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}),
wn=()=>{$('#warn').hidden=false},
tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no(t.error)}),
day=k=>D.days[k]||(D.days[k]={ex:[],cd:[],md:[]}),
flush=()=>tx('kv','readwrite',s=>s.put(D,'d')).catch(wn),
save=()=>{clearTimeout(st);st=setTimeout(flush,300)},
go=()=>{save();navigator.vibrate&&navigator.vibrate(8);render()},
AUTO=(navigator.deviceMemory||4)<=2||(navigator.hardwareConcurrency||4)<=4||matchMedia('(prefers-reduced-motion:reduce)').matches,
lite=()=>D.fx?D.fx==='lite':AUTO,
names=()=>[...new Set(Object.values(D.days).flatMap(d=>d.ex.map(e=>e.n)))].sort(),
prs=()=>{const p={};for(const k of Object.keys(D.days).sort())for(const e of D.days[k].ex)for(const s of e.s){const b=p[e.n];if(!b||s.w>b.w||(s.w===b.w&&s.r>b.r))p[e.n]={w:s.w,r:s.r,d:k}}return p};
let cur=T;

function dayV(){
 const d=day(cur),P=prs(),t=cur===T?'Today':fmt(cur);
 if(d.rest)return `<h2>${t}</h2><div class="card" style="text-align:center"><div class="zz">😴</div><h2>Rest day</h2><p class="mut">Recovery is part of the plan.</p><button onclick="rest()">Undo rest day</button></div>`;
 let h=`<h2>${t}</h2><button class="rb" onclick="rest()">Mark as rest day</button><div class="card"><div class="chips">`
 +['Push','Pull','Legs','Shoulders','Upper','Lower','Free'].map(n=>`<button class="${d.name===n?'on':''}" onclick="sp('${n}')">${n}</button>`).join('')+`</div></div>`;
 d.ex.forEach((e,i)=>{const l=e.s[e.s.length-1]||{w:'',r:''};
  h+=`<div class="card ${pop==='e'+i?'pop':''}"><div class="row"><b>${esc(e.n)}</b><button onclick="de(${i})">Remove</button></div>`
  +e.s.map((s,j)=>{const b=P[e.n],q=b&&b.d===cur&&b.w===s.w&&b.r===s.r;return `<span class="set ${q?'p':''} ${pop==='s'+i+'.'+j?'pop':''}" onclick="ds(${i},${j})">${q?'🏆 ':''}${s.w} kg × ${s.r}</span>`}).join('')
  +`<div class="add"><input id="w${i}" type="number" inputmode="decimal" step="any" placeholder="kg" value="${l.w}"><input id="r${i}" type="number" inputmode="numeric" placeholder="reps" value="${l.r}"><button onclick="aset(${i})">Add set</button></div></div>`});
 h+=(d.ex.some(e=>e.s.length)?'<p class="mut">Tap a logged set to delete it.</p>':'')
 +`<div class="card"><button class="lk" onclick="mr()">${more?'View less':'View more'}</button>${more?pv():''}<div class="add" style="grid-template-columns:1fr auto"><input id="nx" list="exl" placeholder="Add exercise"><button onclick="ae()">Add</button></div><datalist id="exl">${names().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>`
 +`<div class="card"><b>Cardio</b>`+d.cd.map((c,i)=>`<div class="row"><span>${esc(c.t)}, ${c.m} min, ${c.k} km</span><button onclick="dc(${i})">✕</button></div>`).join('')
 +`<div class="g" style="margin-top:8px"><input id="ct" placeholder="Run, bike…"><input id="cmin" type="number" inputmode="decimal" placeholder="minutes"><input id="ckm" type="number" inputmode="decimal" placeholder="km"><button onclick="ac()">Add cardio</button></div></div>`
 +`<div class="card"><b>Photos and videos</b><div>`+d.md.map(m=>`<span class="mw">${m.v?'<video class="th" data-m="'+m.id+'" controls preload="metadata"></video>':'<img class="th" data-m="'+m.id+'" alt="">'}<b onclick="dm('${m.id}')">×</b></span>`).join('')
 +`</div><label class="btn" style="display:block;text-align:center;margin-top:8px">Add photo or video<input type="file" accept="image/*,video/*" multiple hidden onchange="am(this)"></label></div>`;
 return h}

const rest=()=>{const d=day(cur);d.rest=!d.rest;go()},
sp=n=>{const d=day(cur);d.name=d.name===n?'':n;if(d.name&&d.name!=='Free'&&!d.ex.length){const k=Object.keys(D.days).filter(x=>x<cur&&D.days[x].name===n&&D.days[x].ex.length).sort().pop();if(k)d.ex=D.days[k].ex.map(e=>({n:e.n,s:[]}))}go()},
ae=()=>{let n=$('#nx').value.trim();if(!n)return;n=names().find(x=>x.toLowerCase()===n.toLowerCase())||n;const x=day(cur).ex;x.push({n,s:[]});pop='e'+(x.length-1);go()},
aset=i=>{const w=parseFloat($('#w'+i).value)||0,r=parseInt($('#r'+i).value);if(!r)return;const s=day(cur).ex[i].s;s.push({w,r});pop='s'+i+'.'+(s.length-1);go()},
ds=(i,j)=>{day(cur).ex[i].s.splice(j,1);go()},
de=i=>{if(confirm('Remove this exercise and its sets?')){day(cur).ex.splice(i,1);go()}},
ac=()=>{const m=parseFloat($('#cmin').value)||0,k=parseFloat($('#ckm').value)||0;if(!m&&!k)return;day(cur).cd.push({t:$('#ct').value.trim()||'Cardio',m,k});go()},
dc=i=>{day(cur).cd.splice(i,1);go()},
hy=()=>document.querySelectorAll('[data-m]').forEach(async el=>{try{el.src=URL.createObjectURL(await tx('media','readonly',s=>s.get(el.dataset.m)))}catch(e){}});
async function am(el){for(const f of el.files){const id=Date.now()+'-'+Math.random().toString(36).slice(2,7);try{await tx('media','readwrite',s=>s.put(f,id));day(cur).md.push({id,v:f.type.startsWith('video')})}catch(e){alert('Could not save this file. Storage may be blocked or full.')}}go()}
async function dm(id){try{await tx('media','readwrite',s=>s.delete(id))}catch(e){}const d=day(cur);d.md=d.md.filter(m=>m.id!==id);go()}

function calV(){
 const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=`<div class="row"><button onclick="mv(-1)">‹</button><h2>${cm.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="mv(1)">›</button></div><div class="cal">`+[...'SMTWTFS'].map(x=>`<i>${x}</i>`).join('')+'<span></span>'.repeat(f);
 for(let i=1;i<=n;i++){const k=y+'-'+p2(m+1)+'-'+p2(i),d=D.days[k],c=d&&d.rest?'r':d&&(d.ex.length||d.cd.length)?'w':'';h+=`<button class="c ${c} ${k===T?'t':''}" style="--d:${i}" onclick="op('${k}')">${i}</button>`}
 return h+`</div><p class="mut">Blue: workout. Green: rest day. Tap a day to see or edit it.</p>`}

const BF=[['w','Weight (kg)'],['wa','Waist (cm)'],['ch','Chest (cm)'],['ar','Arm (cm)'],['th','Thigh (cm)'],['ht','Height (cm)']];
function bodyV(){
 const L=[...D.body].sort((a,b)=>b.d.localeCompare(a.d));
 return `<h2>Body</h2><div class="card"><div id="b3d" class="b3d"></div><p class="mut" style="text-align:center;margin:6px 0 0">Drag to rotate. Change a size below and the body updates live.</p></div><div class="card"><div class="g">`+BF.map(([k,l])=>`<label>${l}<input id="b${k}" type="number" inputmode="decimal" step="any" value="${lt(k)||''}" oninput="setK()"></label>`).join('')+`</div><button class="pri" onclick="sb()">Save for today</button></div>`
 +L.map(e=>`<div class="card row"><span><b>${fmt(e.d)}</b><br>${BF.filter(([k])=>e[k]).map(([k,l])=>l.split(' ')[0].toLowerCase()+' '+e[k]).join(', ')}</span><button onclick="bd('${e.d}')">✕</button></div>`).join('')}
const sb=()=>{const e={d:T};BF.forEach(([k])=>{const x=parseFloat($('#b'+k).value);if(x)e[k]=x});if(Object.keys(e).length<2)return;const i=D.body.findIndex(x=>x.d===T);if(i<0)D.body.push(e);else Object.assign(D.body[i],e);go()},
bd=d=>{D.body=D.body.filter(x=>x.d!==d);go()};

const series=n=>{const o=[];for(const k of Object.keys(D.days).sort()){const s=D.days[k].ex.filter(e=>e.n===n).flatMap(e=>e.s);if(s.length)o.push({k,w:Math.max(...s.map(x=>x.w))})}return o},
gx=n=>{const s=series(n);return s.length>1?`<div data-n="${esc(n)}" onclick="gv(this.dataset.n)" style="margin-top:12px">${chart(s.slice(-7),0)}<small class="mut">Top weight per day (kg). Tap for full history.</small></div>`:'<small class="mut" style="display:block;margin-top:10px">Your graph appears after a second day.</small>'},
mr=()=>{more=!more;pop=more?'m':'';render()},
pv=()=>{const have=day(cur).ex.map(e=>e.n),ks=Object.keys(D.days).filter(k=>k<cur&&D.days[k].ex.length).sort().reverse().slice(0,14);
 return `<div class="pvp ${pop==='m'?'rv':''}">`+(ks.length?ks.map(k=>`<div class="pvd">${fmt(k)}${D.days[k].name?', '+esc(D.days[k].name):''}</div>`+D.days[k].ex.map(e=>{const h=have.includes(e.n);return `<button class="pv" data-n="${esc(e.n)}" onclick="adp(this.dataset.n)"${h?' disabled':''}>${h?'✓ ':''}${esc(e.n)}<small>${e.s.slice(0,3).map(s=>s.w+'×'+s.r).join(', ')||'no sets'}</small></button>`}).join('')).join(''):'<p class="mut">Nothing from earlier days yet.</p>')+'</div>'},
adp=n=>{const x=day(cur).ex;if(x.some(e=>e.n===n))return;const t=$('.pvp').scrollTop;x.push({n,s:[]});pop='e'+(x.length-1);go();$('.pvp').scrollTop=t},
gv=n=>{const p=series(n),sh=$('#sheet');
 let h=`<div class="row"><div><h2 style="margin:0">${esc(n)}</h2>${p.length?`<span class="mut">Since ${fmt(p[0].k)}, ${p.length} day${p.length>1?'s':''}</span>`:''}</div><button onclick="history.back()">✕</button></div>`;
 if(p.length<2)h+='<p class="mut">Log this exercise on another day to see your graph.</p>';
 else{const f=p[0].w,l=p[p.length-1].w,b=Math.max(...p.map(q=>q.w)),c=+(l-f).toFixed(2);
  h+=`<p class="mut" style="margin:10px 0 0">Top set weight (kg) per day</p>${chart(p,1)}<div class="g3"><div><label>Started</label><b>${f} kg</b></div><div><label>Latest</label><b>${l} kg</b></div><div><label>Best</label><b>${b} kg</b></div></div><p class="mut" style="text-align:center;margin:10px 0 0">${c?(c>0?'Up ':'Down ')+Math.abs(c)+' kg since you started':'No change since you started'}</p>`}
 sh.innerHTML='<div class="card">'+h+'</div>';sh.hidden=false;history.pushState({g:1},'')};

function chart(p,F){
